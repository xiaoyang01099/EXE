buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
        maven {
            url 'https://maven.aliyun.com/repository/public/'
        }
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url = 'https://cursemaven.com' }
    }
    dependencies {
        classpath 'gradle.plugin.com.matthewprenger:CurseGradle:1.4.0'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'com.matthewprenger.cursegradle'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets {
    stellarVerification {
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.runtimeClasspath
    }
    frostVerification {
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.runtimeClasspath
    }
    vineVerification {
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.runtimeClasspath
    }
    yuhuaVerification {
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'


            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            if (project.hasProperty('stellarSmoke')) {
                workingDirectory project.file('build/stellar-smoke')
                property 'exe.stellarSmoke', 'true'
                property 'forge.logging.console.level', 'info'
                args '--width', '1280', '--height', '720', '--username', 'StellarTest'
                mods { "${mod_id}" { source sourceSets.stellarVerification } }
            }
            if (project.hasProperty('frostSmoke')) {
                workingDirectory project.file('build/frost-smoke')
                property 'exe.frostSmoke', 'true'
                property 'forge.logging.console.level', 'info'
                args '--width', '1280', '--height', '720', '--username', 'FrostTest'
                mods { "${mod_id}" { source sourceSets.frostVerification } }
            }
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('vineSmoke')) {
                workingDirectory project.file('build/vine-smoke')
                property 'exe.vineSmoke', 'true'
                property 'forge.logging.console.level', 'info'
                args '--width', '1280', '--height', '720', '--username', 'VineTest'
                mods { "${mod_id}" { source sourceSets.vineVerification } }
            }
            if (project.hasProperty('yuhuaSmoke')) {
                workingDirectory project.file('build/yuhua-smoke')
                property 'exe.yuhuaSmoke', 'true'
                if (project.hasProperty('yuhuaMultiplayer')) property 'exe.yuhuaMultiplayer', 'true'
                property 'forge.logging.console.level', 'info'
                args '--width', '1280', '--height', '720', '--username', 'YuhuaTest'
                mods { "${mod_id}" { source sourceSets.yuhuaVerification } }
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('yuhuaTest')) {
                workingDirectory project.file('build/yuhua-server-test')
                property 'exe.yuhuaTest', 'true'
                property 'forge.logging.console.level', 'info'
                mods { "${mod_id}" { source sourceSets.yuhuaVerification } }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url 'https://maven.aliyun.com/repository/public/' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
    maven { url 'https://maven.aliyun.com/repository/forge/' }
    maven { url 'https://maven.aliyun.com/repository/central/' }

    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    flatDir {
        dir 'libs'
    }
}

dependencies {

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    //implementation fg.deobf("blank:jian:1.0-SNAPSHOT")

    compileOnly(fg.deobf("curse.maven:crafttweaker-239197:7772873"))
    runtimeOnly(fg.deobf("curse.maven:crafttweaker-239197:7772873"))

    compileOnly(fg.deobf("curse.maven:jei-238222:7391695"))
    runtimeOnly(fg.deobf("curse.maven:jei-238222:7391695"))

    compileOnly fg.deobf("curse.maven:jade-324717:6855440")
    runtimeOnly fg.deobf("curse.maven:jade-324717:6855440")

    compileOnly fg.deobf("curse.maven:projecte-226410:4901949")
    runtimeOnly fg.deobf("curse.maven:projecte-226410:4901949")

    compileOnly fg.deobf("curse.maven:botania-225643:7649894")
    runtimeOnly fg.deobf("curse.maven:botania-225643:7649894")

    compileOnly fg.deobf("curse.maven:patchouli-306770:6164575")
    runtimeOnly fg.deobf("curse.maven:patchouli-306770:6164575")

    compileOnly fg.deobf("curse.maven:avaritia-endless-624491:8464705")
    runtimeOnly fg.deobf("curse.maven:avaritia-endless-624491:8464705")

    compileOnly fg.deobf("curse.maven:enigmatic-legacy-336184:5600004")
    runtimeOnly fg.deobf("curse.maven:enigmatic-legacy-336184:5600004")

    runtimeOnly fg.deobf("curse.maven:caelus-308989:5281700")
    compileOnly fg.deobf("curse.maven:caelus-308989:5281700")

    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api")

    runtimeOnly fg.deobf("curse.maven:applied-energistics-2-223794:7148487")
    compileOnly fg.deobf("curse.maven:applied-energistics-2-223794:7148487")

    runtimeOnly fg.deobf("curse.maven:guideme-1173950:8204776")
    compileOnly fg.deobf("curse.maven:guideme-1173950:8204776")

    implementation fg.deobf("curse.maven:photon-871522:7501597")
    implementation fg.deobf("curse.maven:ldlib-626676:8430516")

    if (project.hasProperty('yuhuaTest')) {
        compileOnly fg.deobf("curse.maven:embeddium-908741:5681725")
        compileOnly fg.deobf("curse.maven:oculus-581495:6020952")
    } else {
        implementation fg.deobf("curse.maven:embeddium-908741:5681725")
        implementation fg.deobf("curse.maven:oculus-581495:6020952")
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

if (project.hasProperty('yuhuaSmoke') || project.hasProperty('yuhuaTest')) {
    tasks.matching { it.name in ['runClient', 'runGameTestServer'] }.configureEach {
        dependsOn 'yuhuaVerificationClasses'
    }
}

if (project.hasProperty('vineSmoke')) {
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'vineVerificationClasses' }
}

if (project.hasProperty('frostSmoke')) {
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'frostVerificationClasses' }
}

if (project.hasProperty('stellarSmoke')) {
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'stellarVerificationClasses' }
}
